name: Build HTML Preview

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.build.outputs.publish }}
      archive: ${{ steps.build.outputs.archive }}
      pdf: ${{ steps.build.outputs.pdf }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          token: ${{ secrets.RESOURCES_PAT }}
          persist-credentials: false

      - name: Show pinned commits
        run: |
          git rev-parse HEAD
          git submodule status

      ### Dependencies
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Bikeshed
        run: |
          pip install bikeshed
          bikeshed update

      ### Build steps
      - name: Prepare build directory
        run: node .github/scripts/reset-tmp.mjs

      # Prepares resources biblio combined with the entries from ./local-biblio.json
      - name: Prepare biblio
        run: node .github/scripts/merge-local-biblio.mjs

      - name: Build HTML files
        id: build
        run: node .github/scripts/build.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.archive }}
          path: output/
          if-no-files-found: error

  pdf:
    needs: build
    if: needs.build.outputs.pdf == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.archive }}
          path: output/

      # Needed for HTML to PDF conversion
      - name: Install wkhtmltopdf
        run: |
          wget -q -P "$RUNNER_TEMP" https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6.1-3/wkhtmltox_0.12.6.1-3.jammy_amd64.deb
          sudo apt-get install -y "$RUNNER_TEMP"/wkhtmltox_0.12.6.1-3.jammy_amd64.deb
          wkhtmltopdf --version

      - name: Convert HTML to PDF
        run: |
          for html in output/*.html; do
            wkhtmltopdf --enable-local-file-access \
              --footer-font-size 9 --footer-center "[page]/[topage]" \
              "$html" "${html%.html}.pdf"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.build.outputs.archive }}
          path: output/
          overwrite: true
          if-no-files-found: error

  deploy:
    needs: [build, pdf]
    if: >-
      !cancelled() && needs.build.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.pdf.result)
      && needs.build.outputs.publish == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.archive }}
          path: output/

      - name: Build index and stable links
        run: node .github/scripts/build-index.mjs

      - uses: actions/upload-pages-artifact@v5
        with:
          path: output/

      - id: deployment
        uses: actions/deploy-pages@v5
