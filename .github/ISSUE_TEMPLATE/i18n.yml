name: "Internationalization Concern"
description: File an issue related to an internationalization concern.
title: "[i18n] "
labels: ["i18n", "triage"]
assignees: []
type: task
body:
  - type: textarea
    id: issue-body
    attributes:
      label: Issue Details
      description: Provide a detailed description of the issue.
      placeholder: "Describe the internationalization concern."
    validations:
      required: true
  - type: checkboxes
    id: willing-to-pr
    attributes:
      label: Contribution
      options:
        - label: I'm willing to submit a pull request for this
          required: false