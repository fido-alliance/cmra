name: "Feature or Capability Proposal"
description: File an issue related to a feature or capability proposal.
title: "[feat] "
labels: ["feature", "triage"]
assignees: []
type: task
body:
    validations:
      required: true
  - type: textarea
    id: issue-body
    attributes:
      label: Issue Details
      description: Propose the feature or capability.
    validations:
      required: true
  - type: checkboxes
    id: willing-to-pr
    attributes:
      label: Contribution
      options:
        - label: I'm willing to submit a pull request for this
          required: false