name: "Accessibility Concern"
description: File an issue related to an accessibility concern.
title: "[a11y] "
labels: ["a11y", "triage"]
assignees: []
type: task
body:
  - type: textarea
    id: issue-body
    attributes:
      label: Issue Details
      description: Provide a detailed description of the issue.
      placeholder: "Describe the accessibility concern."
    validations:
      required: true
  - type: checkboxes
    id: willing-to-pr
    attributes:
      label: Contribution
      options:
        - label: I'm willing to submit a pull request for this
          required: false