name: "Editorial Change"
description: File an issue related to an editorial change.
title: "[editorial] "
labels: ["editorial", "triage"]
assignees: []
type: task
body:
  - type: textarea
    id: issue-body
    attributes:
      label: Issue Details
      description: Provide a detailed description of the editorial change.
      placeholder: "Describe the editorial change."
    validations:
      required: true
  - type: checkboxes
    id: willing-to-pr
    attributes:
      label: Contribution
      options:
        - label: I'm willing to submit a pull request for this
          required: false